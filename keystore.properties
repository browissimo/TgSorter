# Ключ для подписи release-APK. Сгенерирован специально для этого проекта.
# Один и тот же ключ нужен, чтобы новые версии APK устанавливались поверх старых
# без удаления приложения (иначе пропадёт прогресс).
# Если публикуете репозиторий открыто — можно сгенерировать свой ключ (см. README).
storeFile=keystore/tgsorter-release.jks
storePassword=tgsorter-local
keyAlias=tgsorter
keyPassword=tgsorter-local
